name: Windows Desktop

on:
  push:
    branches:
      - feature/windows-desktop-manager-20260928
  pull_request:
    paths:
      - "desktop/**"
      - "DESKTOP.bat"
      - "BUILD-DESKTOP.bat"
      - ".github/workflows/windows-desktop.yml"

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core regression tests
        run: python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Python syntax
        run: python -m py_compile desktop/app.py desktop/strata_desktop_core.py desktop/calibrate_selected.py
      - name: Package native Windows GUI
        run: |
          python -m pip install "pyinstaller>=6,<7"
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name StrataDesktop --paths desktop desktop/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: StrataDesktop-Windows
          path: dist/StrataDesktop/
          if-no-files-found: error
